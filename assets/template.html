<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root {
__THEME_CSS__
  --panel-w: var(--panel-width, clamp(360px, 38vw, 560px));
  --radius: 14px;
  --shadow: 0 18px 50px rgba(0,0,0,.45);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden;
  background: radial-gradient(120% 90% at 50% 0%, var(--bg-2), var(--bg) 70%);
  color: var(--ink); font-family: var(--font-body); line-height: 1.55;
}
button { font: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--accent-2); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- top bar ---------- */
.topbar {
  position: fixed; inset: 0 0 auto 0; z-index: 30; height: 56px;
  display: flex; align-items: center; gap: 16px; padding: 0 20px;
  color: var(--topbar-ink);
  background: linear-gradient(to bottom, rgba(0,0,0,.55), rgba(0,0,0,0));
  font-family: var(--font-display); letter-spacing: .02em;
}
.topbar .book-title { flex: 1; font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: .92; }
.topbar .progress { font-size: .85rem; opacity: .85; }
.topbar .ghost {
  background: rgba(255,255,255,.08); color: inherit; border: 1px solid rgba(255,255,255,.25);
  border-radius: 999px; padding: 6px 14px; font-size: .85rem; backdrop-filter: blur(6px);
}
.topbar .ghost:hover { background: rgba(255,255,255,.18); }

/* ---------- pages ---------- */
.pages { position: absolute; inset: 0; }
.page {
  position: absolute; inset: 0; opacity: 0; visibility: hidden; pointer-events: none;
  transition: opacity .6s ease, visibility 0s linear .6s;
}
.page.active { opacity: 1; visibility: visible; pointer-events: auto; transition: opacity .6s ease, visibility 0s; }
/* the art spans the whole spread's width but is clipped to the left leaf; the right leaf is paper.
   Parallax moves .art and the rise animates the <svg>: both are transforms outside the SVG, so
   its filters rasterise once and the compositor does the rest. Never animate inside the SVG. */
.scene { position: absolute; inset: 0 50% 0 0; overflow: hidden; z-index: 1; }
.scene .art { position: absolute; inset: 0; will-change: transform; transition: transform .35s ease-out; }
.scene svg { width: 200%; height: 100%; display: block; will-change: transform; }
/* A warm reading light from above plus a soft edge falloff. Kept gentle: a heavy black
   vignette is what made bright pop-up palettes read as muddy. */
.vignette { position: absolute; inset: 0; pointer-events: none; z-index: 20;
  background: radial-gradient(52% 44% at 38% 8%, var(--lamp, rgba(255,243,210,.30)), transparent 72%),
              radial-gradient(96% 86% at 50% 45%, transparent 62%, var(--vignette, rgba(0,0,0,.38)) 100%); }

/* ---------- the book ---------- */
/* Every page is an open spread lying on a table: art on the left leaf, words on the right,
   a gutter down the middle and the stacked leaves showing at the fore-edges. */
.book { position: absolute; inset: 6vh 5.5vw 9vh; }
.book::before, .book::after { content: ""; position: absolute; top: 14px; bottom: 14px; width: 12px; z-index: 0;
  background: repeating-linear-gradient(var(--paper) 0 2px, var(--paper-edge) 2px 4px); border-radius: 3px; }
.book::before { left: -11px; } .book::after { right: -11px; }
.spread { position: absolute; inset: 0; overflow: hidden; border-radius: 16px;
  background: var(--paper) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .45 0 0 0 0 .35 0 0 0 .07 0'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>");
  display: grid; grid-template-columns: 1fr 1fr;
  box-shadow: 0 34px 60px rgba(30,16,6,.5), 0 90px 120px -40px rgba(30,16,6,.55), 0 2px 0 rgba(0,0,0,.3);
  transform: translateY(22px) scale(.985); opacity: 0;
  transition: transform .8s cubic-bezier(.2,.8,.2,1), opacity .7s ease; }
.page.active .spread { transform: none; opacity: 1; }
/* the valley fold: darkest exactly on the centre line */
.gutter { position: absolute; left: 0; right: 0; top: 0; bottom: 0; z-index: 3; pointer-events: none;
  background: linear-gradient(to right, transparent 41%, color-mix(in srgb, var(--paper-shadow) 55%, transparent) 50%, transparent 59%); }
/* paper bowing: a highlight along the top of the leaves, shade along the bottom */
.spread::after { content: ""; position: absolute; inset: 0; z-index: 4; pointer-events: none;
  box-shadow: inset 0 16px 26px -16px rgba(255,255,255,.8), inset 0 -18px 28px -18px rgba(60,36,14,.45); }

/* the right leaf: a printed page, not a floating card */
.panel {
  grid-column: 2; min-width: 0; position: relative; z-index: 2; background: transparent; color: var(--ink);
  height: 100%; overflow-y: auto; padding: 6% 8% 0 13%;
  display: flex; flex-direction: column;
}
.panel::before { content: ""; position: absolute; inset: 4% 5%; z-index: 0;
  border: 2px solid color-mix(in srgb, var(--paper-edge) 60%, transparent); border-radius: 10px; pointer-events: none; }
.panel > * { position: relative; z-index: 1; }
.folio { position: absolute; bottom: 2.6%; right: 7%; z-index: 1; font-family: var(--font-display);
  color: var(--ink-muted); font-size: .82rem; letter-spacing: .06em; }
.eyebrow { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .18em; font-size: .72rem; color: var(--accent); margin: 0 0 6px; }
.panel h1, .panel h2 { font-family: var(--font-display); line-height: 1.15; margin: 0 0 10px; color: var(--ink); }
.panel h2 { font-size: calc(clamp(1.6rem, 2.4vw, 2.3rem) * var(--type-scale, 1)); font-weight: 600; letter-spacing: .005em; }
.ornament { color: var(--paper-edge); display: flex; justify-content: center; margin: 2px 0 12px; }
.narrative { font-size: calc(1.08rem * var(--type-scale, 1)); line-height: 1.68; }
.narrative p { margin: 0 0 .85em; }
body:not(.no-drop-cap) .narrative p:first-of-type::first-letter { font-family: var(--font-display); font-size: 3.1em; float: left; line-height: .8; padding: .08em .1em 0 0; color: var(--accent); }
.narrative code, .explanation code, .source code { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: .9em; background: color-mix(in srgb, var(--paper-edge) 22%, transparent); padding: .1em .35em; border-radius: 4px; }
.narrative pre, .explanation pre, .source pre { background: color-mix(in srgb, var(--ink) 92%, var(--paper)); color: var(--paper); padding: 12px 14px; border-radius: 8px; overflow-x: auto; font-size: .85rem; line-height: 1.45; }
.narrative pre code, .explanation pre code, .source pre code { background: none; padding: 0; color: inherit; }
.narrative blockquote, .explanation blockquote, .source blockquote { margin: 0 0 1em; padding: 4px 14px; border-left: 3px solid var(--accent-2); color: var(--ink-muted); font-style: italic; }
.source table, .explanation table { border-collapse: collapse; width: 100%; font-size: .88rem; margin: 0 0 1em; }
.source th, .source td, .explanation th, .explanation td { border: 1px solid color-mix(in srgb, var(--paper-edge) 60%, transparent); padding: 6px 8px; text-align: left; vertical-align: top; }
.source th, .explanation th { background: color-mix(in srgb, var(--paper-edge) 25%, transparent); font-family: var(--font-display); }

/* pop-out links inside narrative */
.popout-link {
  display: inline; cursor: pointer; text-decoration: none;
  background: none; border: 0; padding: 0 .08em; color: var(--accent); font: inherit; font-weight: 600;
  border-bottom: 2px dotted var(--accent-2); border-radius: 2px; position: relative;
  transition: background .2s, box-shadow .2s;
}
.popout-link::after { content: "\25C6"; font-size: .55em; vertical-align: super; margin-left: .15em; color: var(--accent-2); }
.popout-link:hover, .popout-link.seen:hover { background: color-mix(in srgb, var(--accent-2) 22%, transparent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent-2) 22%, transparent); }
.popout-link.seen { border-bottom-style: solid; }

/* technical note: the plain-fact box at the foot of a stage */
.tech-note { margin: 14px 0 0; padding: 12px 16px; border-radius: 12px;
  background: color-mix(in srgb, var(--accent-2) 22%, var(--paper));
  border: 1px solid color-mix(in srgb, var(--paper-edge) 45%, transparent);
  font-size: calc(.92rem * var(--type-scale, 1)); line-height: 1.5; }
.tech-note .note-label { display: block; font-family: var(--font-display); text-transform: uppercase;
  letter-spacing: .14em; font-size: .68em; color: var(--accent); margin: 0 0 6px; }
.tech-note p { margin: 0 0 .6em; }
.tech-note p:last-child { margin-bottom: 0; }
.tech-note code { background: color-mix(in srgb, var(--ink) 12%, transparent); }
.tech-note ul, .tech-note ol { margin: 0 0 .4em; padding-left: 1.2em; }

/* stage footer */
.stage-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: auto;
  /* full-bleed to the leaf's padding box so scrolling text cannot show beneath it */
  margin-left: -13%; margin-right: -8%; padding: 12px 8% 5% 13%;
  border-top: 1px solid color-mix(in srgb, var(--paper-edge) 60%, transparent);
  position: sticky; bottom: 0; z-index: 2; background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(2px);
  box-shadow: 0 -16px 20px -12px color-mix(in srgb, var(--ink) 25%, transparent); }
.btn { border: 0; border-radius: 999px; padding: 10px 18px; font-family: var(--font-display); font-size: .95rem; letter-spacing: .02em; transition: transform .15s, box-shadow .2s, background .2s; }
.btn:hover { transform: translateY(-1px); }
.btn.primary { background: var(--accent); color: var(--paper); box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 45%, transparent); }
.btn.primary:hover { box-shadow: 0 8px 22px color-mix(in srgb, var(--accent) 60%, transparent); }
.btn.secondary { background: transparent; color: var(--ink); border: 1.5px solid var(--paper-edge); }
.btn.secondary:hover { background: color-mix(in srgb, var(--paper-edge) 20%, transparent); }
.btn.link { background: none; color: var(--ink-muted); padding: 10px 8px; text-decoration: underline dotted; text-underline-offset: 4px; }
.btn.link:hover { color: var(--accent); }
.spacer { flex: 1; }

/* ---------- cover & ending ---------- */
.cover-layout, .ending-layout { grid-column: 2; min-width: 0; position: relative; z-index: 2; background: transparent;
  padding: 8% 8% 0 13%; text-align: center; overflow-y: auto; }
.cover-layout { display: grid; place-items: center; padding-bottom: 8%; }
.ending-layout .ending-card { display: flex; flex-direction: column; min-height: 100%; }
.ending-layout .stage-actions { margin-left: -13%; margin-right: -8%; padding: 12px 8% 5% 13%; }
.cover-card { max-width: 520px; color: var(--ink); transform: translateY(20px); opacity: 0; transition: transform 1s cubic-bezier(.2,.8,.2,1) .2s, opacity 1s ease .2s; }
.page.active .cover-card { transform: none; opacity: 1; }
.cover-card .eyebrow { color: var(--accent); }
.cover-card h1 { font-family: var(--font-display); font-size: clamp(2.4rem, 6vw, 4.6rem); line-height: 1.05; margin: 0 0 10px; }
.cover-card .subtitle { font-size: clamp(1.1rem, 1.9vw, 1.45rem); opacity: .92; margin: 0 0 22px; font-style: italic; font-family: var(--font-display); }
.cover-card .blurb { font-size: calc(1.05rem * var(--type-scale, 1)); max-width: 620px; margin: 0 auto 26px; opacity: .95; }
.cover-card .blurb p { margin: 0 0 .8em; }
.cover-card .ornament { color: var(--accent-2); }
.cover-card .btn.primary { font-size: 1.1rem; padding: 14px 30px; }
.cover-card .hint { margin-top: 18px; font-size: .8rem; opacity: .7; }
.ending-layout { text-align: left; }
.ending-layout .ending-card { width: 100%; }
.recap { margin: 0 0 18px; padding-left: 1.2em; font-size: calc(1rem * var(--type-scale, 1)); }
.recap li { margin: 0 0 .5em; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 14px; }
.chip { border: 1.5px solid var(--paper-edge); background: transparent; color: var(--ink); border-radius: 999px; padding: 4px 10px; font-size: .8rem; }
.chip:hover { background: color-mix(in srgb, var(--accent-2) 25%, transparent); border-color: var(--accent-2); }

/* ---------- map ---------- */
.map { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; height: 64px; display: flex; align-items: center; justify-content: center; gap: 0; padding: 0 24px;
  background: linear-gradient(to top, rgba(0,0,0,.6), rgba(0,0,0,0)); }
.map .trail { display: flex; align-items: center; max-width: 900px; width: 100%; }
.map .leg { flex: 1; height: 2px; background: rgba(255,255,255,.25); position: relative; overflow: hidden; }
.map .leg::after { content: ""; position: absolute; inset: 0; background: var(--accent-2); transform: scaleX(0); transform-origin: left; transition: transform .6s ease; }
.map .leg.done::after { transform: scaleX(1); }
.map .node { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255,255,255,.55); background: rgba(0,0,0,.45); padding: 0; position: relative; flex: none; transition: transform .2s, background .3s, border-color .3s; }
.map .node.visited { background: var(--accent-2); border-color: var(--accent-2); }
.map .node.current { transform: scale(1.35); box-shadow: 0 0 0 6px var(--glow); }
.map .node:hover { transform: scale(1.3); }
.map .node .tip { position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%); background: var(--paper); color: var(--ink); padding: 4px 10px; border-radius: 6px; font-size: .78rem; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .2s; font-family: var(--font-display); }
.map .node:hover .tip, .map .node:focus-visible .tip { opacity: 1; }
.map .node.terminus { border-radius: 3px; transform: rotate(45deg); }
.map .node.terminus.current { transform: rotate(45deg) scale(1.3); }

/* ---------- drawer (pop-outs) ---------- */
dialog.drawer { position: fixed; inset: 0 0 0 auto; margin: 0; height: 100%; max-height: 100%; width: min(520px, 100%); border: 0; padding: 0;
  background: var(--paper); color: var(--ink); box-shadow: -20px 0 60px rgba(0,0,0,.5); transform: translateX(100%); transition: transform .45s cubic-bezier(.2,.8,.2,1); }
dialog.drawer[open] { transform: none; }
dialog.drawer::backdrop { background: rgba(0,0,0,.35); backdrop-filter: blur(2px); }
.drawer-inner { height: 100%; overflow-y: auto; padding: 28px 30px 40px; border-left: 6px solid var(--accent); }
.drawer-inner h2 { font-family: var(--font-display); margin: 0 0 12px; font-size: 1.6rem; line-height: 1.15; padding-right: 40px; }
.drawer-inner .eyebrow { padding-right: 48px; }
.drawer-inner .close { position: absolute; top: 14px; right: 14px; border: 0; background: color-mix(in srgb, var(--paper-edge) 30%, transparent); width: 36px; height: 36px; border-radius: 50%; font-size: 1.2rem; line-height: 1; color: var(--ink); }
.drawer-inner .close:hover { background: var(--accent); color: var(--paper); }
.explanation { font-size: calc(1rem * var(--type-scale, 1)); }
.explanation p { margin: 0 0 .9em; }
.explanation ul, .explanation ol, .source ul, .source ol { padding-left: 1.3em; margin: 0 0 1em; }
details.source-box { margin-top: 18px; border: 1px solid var(--paper-edge); border-radius: 10px; background: color-mix(in srgb, var(--paper-edge) 10%, transparent); }
details.source-box summary { cursor: pointer; padding: 10px 14px; font-family: var(--font-display); font-size: .9rem; letter-spacing: .04em; color: var(--accent); list-style: none; display: flex; align-items: center; gap: 8px; }
details.source-box summary::before { content: "\25B8"; transition: transform .2s; }
details.source-box[open] summary::before { transform: rotate(90deg); }
details.source-box .source { padding: 4px 14px 14px; font-size: .92rem; }
.source h1, .source h2, .source h3, .source h4 { font-family: var(--font-display); margin: .6em 0 .4em; line-height: 1.2; }
.source h1 { font-size: 1.3rem; } .source h2 { font-size: 1.15rem; } .source h3 { font-size: 1.02rem; }
.source p { margin: 0 0 .8em; }
.codex-list { list-style: none; margin: 0; padding: 0; }
.codex-list li { padding: 10px 0; border-bottom: 1px solid color-mix(in srgb, var(--paper-edge) 55%, transparent); }
.codex-list .term-btn { background: none; border: 0; padding: 0; text-align: left; color: var(--accent); font-family: var(--font-display); font-size: 1.05rem; font-weight: 600; }
.codex-list .term-btn:hover { text-decoration: underline; }
.codex-list .where { color: var(--ink-muted); font-size: .82rem; margin-top: 2px; }
.codex-list .stage-group { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .14em; font-size: .7rem; color: var(--ink-muted); margin: 16px 0 4px; border: 0; }

/* ---------- pop-up paper ---------- */
/* Shared filters and gradients live in one hidden <svg> so every scene can reference them
   by id without repeating a <defs> block. Shadow colour comes from the theme. */
.paper-defs { position: absolute; width: 0; height: 0; overflow: hidden; }
.paper-defs feDropShadow { flood-color: var(--paper-shadow, #0d3a2c); }

/* The rise: standing pieces unfold from the page when the spread opens. Scoped to
   .page.active so it replays every time the reader turns to the stage, and so inactive
   pages are not animating off-screen. */
@keyframes pop-rise { from { transform: translateY(7%) scaleY(.88); opacity: 0; } to { transform: none; opacity: 1; } }
.page.active .scene svg { animation: pop-rise .75s cubic-bezier(.18,.9,.25,1) both; transform-origin: bottom center; }
/* .pop / rise-N are kept as harmless markers on scene groups; they no longer animate individually */

/* ---------- subtle life on cards: groups the engine marks with data-anim. They hold only
   unfiltered shapes, so each frame is a cheap repaint. Amplitudes are deliberately small. ---------- */
@keyframes a-flap   { 0%,100% { transform: rotate(0) }        50% { transform: rotate(calc(-1deg * var(--amt, 5))) } }
@keyframes a-flap-r { 0%,100% { transform: rotate(0) }        50% { transform: rotate(calc( 1deg * var(--amt, 5))) } }
@keyframes a-sway   { 0%,100% { transform: rotate(calc(-1deg * var(--amt, 2))) } 50% { transform: rotate(calc(1deg * var(--amt, 2))) } }
@keyframes a-bob    { 0%,100% { transform: translateY(0) }    50% { transform: translateY(calc(-1px * var(--amt, 6))) } }
@keyframes a-flicker{ 0%,100% { transform: scale(1, 1); opacity: .96 } 30% { transform: scale(.985, 1.03); opacity: 1 } 60% { transform: scale(1.015, .97); opacity: .9 } }
@keyframes a-pulse  { 0%,100% { opacity: .75 } 50% { opacity: 1 } }
@keyframes a-spin   { to { transform: rotate(360deg) } }
.scene [data-anim] { transform-box: view-box; animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
.scene [data-anim="flap"]    { animation-name: a-flap;    animation-duration: 3.4s; }
.scene [data-anim="flap-r"]  { animation-name: a-flap-r;  animation-duration: 3.4s; }
.scene [data-anim="sway"]    { animation-name: a-sway;    animation-duration: 4.5s; }
.scene [data-anim="bob"]     { animation-name: a-bob;     animation-duration: 3.8s; }
.scene [data-anim="flicker"] { animation-name: a-flicker; animation-duration: 1.1s; }
.scene [data-anim="pulse"]   { animation-name: a-pulse;   animation-duration: 2.6s; }
.scene [data-anim="spin"]    { animation-name: a-spin;    animation-duration: 40s; animation-timing-function: linear; }

/* ---------- scene motion helpers (opt-in classes for hand-made SVG) ---------- */
@keyframes drift { from { transform: translateX(-3%); } to { transform: translateX(3%); } }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-1.5%); } }
@keyframes twinkle { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
@keyframes sway { 0%,100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } }
@keyframes pulse { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.06); } }
@keyframes flicker { 0%,100% { opacity: .85; } 40% { opacity: 1; } 60% { opacity: .7; } }
@keyframes spin { to { transform: rotate(360deg); } }
.scene .drift { animation: drift 18s ease-in-out infinite alternate; }
.scene .float { animation: float 6s ease-in-out infinite; }
.scene .twinkle { animation: twinkle 3s ease-in-out infinite; }
.scene .sway { animation: sway 5s ease-in-out infinite; transform-origin: bottom center; transform-box: fill-box; }
.scene .pulse { animation: pulse 3.5s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
.scene .flicker { animation: flicker 1.6s ease-in-out infinite; }
.scene .spin { animation: spin 40s linear infinite; transform-origin: center; transform-box: fill-box; }
.scene .slow { animation-duration: 30s; } .scene .fast { animation-duration: 2s; }
.scene .delay-1 { animation-delay: -1s; } .scene .delay-2 { animation-delay: -2s; } .scene .delay-3 { animation-delay: -3s; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
  .scene .art { transform: none !important; }
}

/* ---------- responsive ---------- */
@media (max-width: 900px) {
  .book { inset: 5vh 4vw 9vh; }
  .spread { grid-template-columns: 1fr; grid-template-rows: 40% 60%; }
  .scene { inset: 0 0 60% 0; grid-row: 1; }
  .panel, .cover-layout, .ending-layout { grid-column: 1; grid-row: 2; padding: 6% 7% 0; }
  .stage-actions { margin-left: -7%; margin-right: -7%; padding: 12px 7% 6%; }
  /* the fold runs across the spread instead of down it */
  .gutter { background: linear-gradient(to bottom, transparent 34%, color-mix(in srgb, var(--paper-shadow) 45%, transparent) 40%, transparent 46%); }
  .topbar .progress { display: none; }
  .map .node .tip { display: none; }
  .cover-card h1 { font-size: 2.2rem; }
  .folio { display: none; }
}
</style>
</head>
<body class="__BODY_CLASS__">
<a class="sr-only" href="#main">Skip to content</a>

<!-- Pop-up paper: shared filters and gradients, referenced from every scene by id.
     paper-far/mid/near are the shadows a standing cut-out throws onto the layer behind it;
     paper-lit is the light falling down a standing flat; paper-fold is the shading either
     side of a centre fold; paper-glow is a cheap sun or lantern halo. -->
<svg class="paper-defs" aria-hidden="true" focusable="false"><defs>
  <filter id="paper-far" x="-25%" y="-25%" width="160%" height="170%">
    <feDropShadow dx="4" dy="10" stdDeviation="7" flood-opacity=".30"/></filter>
  <filter id="paper-mid" x="-25%" y="-25%" width="160%" height="170%">
    <feDropShadow dx="8" dy="20" stdDeviation="11" flood-opacity=".42"/></filter>
  <filter id="paper-near" x="-30%" y="-30%" width="170%" height="180%">
    <feDropShadow dx="12" dy="28" stdDeviation="17" flood-opacity=".50"/></filter>

    <stop offset="0" stop-color="#fff" stop-opacity=".20"/>
    <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    <stop offset="1" stop-color="#001a12" stop-opacity=".18"/></linearGradient>

</defs></svg>

<header class="topbar">
  <div class="book-title" id="book-title"></div>
  <div class="progress" id="progress" aria-live="polite"></div>
  <button class="ghost" id="codex-btn" type="button"></button>
</header>
<main class="pages" id="main" aria-live="polite"></main>
<nav class="map" id="map" aria-label="Journey map"><div class="trail" id="trail"></div></nav>
<dialog class="drawer" id="drawer" aria-labelledby="drawer-title">
  <div class="drawer-inner">
    <button class="close" id="drawer-close" type="button" aria-label="Close">&times;</button>
    <div id="drawer-content"></div>
  </div>
</dialog>

<script id="book-data" type="application/json">__BOOK_JSON__</script>
<script>
(function () {
  'use strict';
  var BOOK = JSON.parse(document.getElementById('book-data').textContent);
  var THEME = BOOK.theme || {};
  var V = Object.assign({
    begin: 'Begin', next: 'Next', back: 'Back', finish: 'Finish', restart: 'Start again',
    scroll: 'Read the original', codex: 'Codex', map: 'Map', chapter: 'Chapter', recap: 'What was learnt',
    source: 'From the original', behind: 'Behind the tale', close: 'Close', stageOf: 'Stage {n} of {total}', note: 'The technical bit',
    codexIntro: 'Every marked word in the tale hides something real.'
  }, THEME.vocabulary || {});
  var stages = BOOK.stages || [];
  var pages = [{ type: 'cover' }].concat(stages.map(function (s) { return { type: 'stage', stage: s }; }), [{ type: 'ending' }]);
  var index = 0;
  var visited = {};
  var storageKey = 'adventure-book:' + (BOOK.title || 'untitled');
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  try {
    var saved = JSON.parse(localStorage.getItem(storageKey) || 'null');
    if (saved && typeof saved.index === 'number' && saved.index < pages.length) { index = saved.index; visited = saved.visited || {}; }
  } catch (e) { /* storage unavailable: fine */ }
  var hashPage = /^#page-(\d+)$/.exec(location.hash);
  if (hashPage && Number(hashPage[1]) < pages.length) index = Number(hashPage[1]);

  // ---------- helpers ----------
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function fmt(s, vars) { return s.replace(/\{(\w+)\}/g, function (_, k) { return vars[k] != null ? vars[k] : ''; }); }
  function ornament() { return THEME.ornament ? '<div class="ornament">' + THEME.ornament + '</div>' : ''; }
  function allPopouts() {
    var out = [];
    stages.forEach(function (s, i) { (s.popouts || []).forEach(function (p) { out.push({ popout: p, stage: s, stageIndex: i }); }); });
    (BOOK.popouts || []).forEach(function (p) { out.push({ popout: p, stage: null, stageIndex: -1 }); });
    return out;
  }
  function findPopout(id, stage) {
    var local = (stage && stage.popouts || []).filter(function (p) { return p.id === id; })[0];
    if (local) return local;
    var hit = allPopouts().filter(function (e) { return e.popout.id === id; })[0];
    return hit ? hit.popout : null;
  }

  // ---------- default scene generator (used when a stage has no hand-made SVG) ----------
  function rng(seed) { var t = seed * 9301 + 49297; return function () { t = (t * 9301 + 49297) % 233280; return t / 233280; }; }
  function defaultScene(i, style) {
    var r = rng(i + 7), W = 1600, H = 900, s = '';
    var sky = '<defs><linearGradient id="sky' + i + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--sky-1)"/><stop offset="1" style="stop-color:var(--sky-2)"/></linearGradient>' +
              '<linearGradient id="seam' + i + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--paper-shadow)" stop-opacity=".42"/><stop offset=".2" style="stop-color:var(--paper-shadow)" stop-opacity="0"/></linearGradient>' +
              '<filter id="dof' + i + '" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="7"/><feColorMatrix type="saturate" values=".72"/></filter>' +
              '<filter id="soft' + i + '" x="-40%" y="-80%" width="180%" height="260%"><feGaussianBlur stdDeviation="14"/></filter>' +
              '<radialGradient id="halo' + i + '" cx=".5" cy=".5" r=".5"><stop offset="0" style="stop-color:var(--accent-2)" stop-opacity=".55"/><stop offset="1" style="stop-color:var(--accent-2)" stop-opacity="0"/></radialGradient></defs>' +
              '<rect width="' + W + '" height="' + H + '" fill="url(#sky' + i + ')"/>';
    // a smooth closed curve through points, the same Catmull-Rom the engine uses
    function curve(pts) {
      var n = pts.length, d = 'M' + pts[0][0].toFixed(0) + ' ' + pts[0][1].toFixed(0);
      for (var k = 0; k < n; k++) {
        var p0 = pts[(k - 1 + n) % n], p1 = pts[k], p2 = pts[(k + 1) % n], p3 = pts[(k + 2) % n];
        var c1x = p1[0] + (p2[0] - p0[0]) / 7.5, c1y = p1[1] + (p2[1] - p0[1]) / 7.5, c2x = p2[0] - (p3[0] - p1[0]) / 7.5, c2y = p2[1] - (p3[1] - p1[1]) / 7.5;
        d += ' C' + c1x.toFixed(0) + ' ' + c1y.toFixed(0) + ' ' + c2x.toFixed(0) + ' ' + c2y.toFixed(0) + ' ' + p2[0].toFixed(0) + ' ' + p2[1].toFixed(0);
      }
      return d + ' Z';
    }
    function hill(base, amp, color, op) {
      var pts = [[-60, 720]], x = -60;
      while (x < W + 60) { x += 180 + r() * 120; pts.push([x, base - 40 - r() * amp]); }
      pts.push([W + 60, 720]);
      return '<path d="' + curve(pts) + '" fill="' + color + '" opacity="' + op + '"/>';
    }
    // 1. back panel: sun, a cloud, two soft hills, all out of focus
    var panel = '<g data-depth="0.02" filter="url(#dof' + i + ')">';
    if (style === 'stars') {
      for (var k = 0; k < 90; k++) panel += '<circle cx="' + (r() * W).toFixed(0) + '" cy="' + (r() * H * .6).toFixed(0) + '" r="' + (1 + r() * 2.2).toFixed(1) + '" fill="#fff" opacity="' + (.4 + r() * .6).toFixed(2) + '"/>';
      panel += '<circle cx="1180" cy="200" r="220" fill="url(#halo' + i + ')" opacity=".6"/><circle cx="1180" cy="200" r="70" style="fill:var(--paper)"/>';
    } else {
      panel += '<circle cx="300" cy="190" r="230" fill="url(#halo' + i + ')"/><circle cx="300" cy="190" r="68" style="fill:var(--accent-2)" opacity=".9"/>';
      panel += '<path d="' + curve([[460, 240], [470, 200], [520, 170], [580, 180], [620, 140], [690, 144], [730, 190], [780, 200], [786, 244], [750, 270], [490, 270]]) + '" fill="#fff" opacity=".9"/>';
    }
    if (style === 'waves') {
      panel += hill(640, 30, 'color-mix(in srgb, var(--water) 55%, var(--sky-2))', .7) + hill(670, 24, 'color-mix(in srgb, var(--water) 75%, var(--sky-2))', .6);
    } else if (style === 'skyline') {
      var x = -40; panel += '<g opacity=".55">';
      while (x < W) { var bw = 60 + r() * 120, bh = 120 + r() * 300; panel += '<rect x="' + x.toFixed(0) + '" y="' + (700 - bh).toFixed(0) + '" width="' + bw.toFixed(0) + '" height="' + (bh + 40).toFixed(0) + '" style="fill:var(--land-2)"/>'; x += bw + 8; }
      panel += '</g>';
    } else {
      panel += hill(600, 120, 'color-mix(in srgb, var(--land-1) 55%, var(--sky-2))', .7) + hill(626, 80, 'color-mix(in srgb, var(--land-2) 50%, var(--sky-2))', .55);
    }
    panel += '</g>';
    // 2. the page: ground, a path, a few flowers. No hero: the words carry this stage.
    var pageD = 'M-200 900 L60 648 Q700 612 1700 648 L1900 900 Z';
    var page = '<g data-depth="0.12"><path d="' + pageD + '" style="fill:var(--ground)"/><path d="' + pageD + '" fill="url(#seam' + i + ')"/>' +

    for (var f = 0; f < 8; f++) page += '<circle cx="' + (80 + r() * 640).toFixed(0) + '" cy="' + (690 + r() * 190).toFixed(0) + '" r="' + (6 + r() * 3).toFixed(0) + '" style="fill:var(--' + (f % 2 ? 'accent' : 'accent-2') + ')" opacity=".85"/>';
    page += '</g>';
    // 3. two small flats at the near edge, cut card with a shadow, so the page still stands up
    var bush = function (x, y, sc) { return '<path transform="translate(' + x + ',' + y + ') scale(' + sc + ')" d="' + curve([[0, 100], [14, 44], [54, 22], [104, 30], [136, 6], [188, 16], [224, 40], [268, 34], [300, 60], [300, 100]]) + '" style="fill:var(--land-3)" stroke="var(--cut)" stroke-width="12" paint-order="stroke"/>'; };

    return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' + sky + panel + page + flats + '</svg>';
  }
  function sceneMarkup(scene, i) {
    var svg = scene && /^\s*<svg/i.test(scene) ? scene : defaultScene(i, THEME.sceneStyle || 'hills');
    return '<div class="scene"><div class="art">' + svg + '</div></div>';
  }
  // the open spread: art across both leaves, the right leaf laid over it with the words
  function spread(scene, i, leaf) {
    return '<div class="book"><div class="spread">' + sceneMarkup(scene, i) + leaf +
           '<div class="gutter"></div></div></div><div class="vignette"></div>';
  }

  // ---------- rendering ----------
  function renderCover() {
    var c = BOOK.cover || {};
    return spread(c.scene, 0,
      '<div class="cover-layout"><div class="cover-card">' +
      (c.eyebrow ? '<p class="eyebrow">' + esc(c.eyebrow) + '</p>' : '') +
      '<h1>' + esc(BOOK.title) + '</h1>' +
      (BOOK.subtitle ? '<p class="subtitle">' + esc(BOOK.subtitle) + '</p>' : '') +
      ornament() +
      (c.blurb ? '<div class="blurb">' + c.blurb + '</div>' : '') +
      '<button class="btn primary" data-go="1" type="button">' + esc(V.begin) + '</button>' +
      '<p class="hint">' + esc(BOOK.hint || 'Use the arrow keys to travel. Click the highlighted words to look behind the tale.') + '</p>' +
      '</div></div>');
  }
  function renderStage(p, i) {
    var s = p.stage, n = i; // i is 1-based among stages because cover is 0
    var chapter = s.chapter || (V.chapter + ' ' + n);
    return spread(s.scene, i,
      '<article class="panel" tabindex="-1">' +
      '<p class="eyebrow">' + esc(chapter) + '</p>' +
      '<h2>' + esc(s.title) + '</h2>' + ornament() +
      '<div class="narrative">' + (s.narrative || '') + '</div>' +
      (s.note ? '<aside class="tech-note"><span class="note-label">' + esc(V.note) + '</span>' + s.note + '</aside>' : '') +
      '<div class="stage-actions">' +
      (s.sourceExcerpt ? '<button class="btn link" data-scroll="' + i + '" type="button">' + esc(V.scroll) + '</button>' : '') +
      '<span class="spacer"></span>' +
      '<button class="btn secondary" data-go="' + (i - 1) + '" type="button">' + esc(V.back) + '</button>' +
      '<button class="btn primary" data-go="' + (i + 1) + '" type="button">' + esc(i === stages.length ? V.finish : V.next) + '</button>' +
      '</div><span class="folio">' + i + '</span></article>');
  }
  function renderEnding() {
    var e = BOOK.ending || {};
    var recap = (e.recap || []).map(function (r) { return '<li>' + r + '</li>'; }).join('');
    var chips = allPopouts().map(function (x) { return '<button class="chip" data-popout="' + esc(x.popout.id) + '" data-stage="' + x.stageIndex + '" type="button">' + esc(x.popout.term || x.popout.title) + '</button>'; }).join('');
    return spread(e.scene, pages.length - 1,
      '<div class="ending-layout"><article class="ending-card" tabindex="-1">' +
      '<p class="eyebrow">' + esc(e.eyebrow || V.recap) + '</p>' +
      '<h2>' + esc(e.title || BOOK.title) + '</h2>' + ornament() +
      (e.blurb ? '<div class="narrative">' + e.blurb + '</div>' : '') +
      (recap ? '<ul class="recap">' + recap + '</ul>' : '') +
      (chips ? '<p class="eyebrow">' + esc(V.codex) + '</p><div class="chips">' + chips + '</div>' : '') +
      '<div class="stage-actions"><button class="btn secondary" data-go="' + (pages.length - 2) + '" type="button">' + esc(V.back) + '</button><span class="spacer"></span><button class="btn primary" data-go="0" type="button">' + esc(V.restart) + '</button></div>' +
      '</article></div>');
  }

  var main = document.getElementById('main');
  main.innerHTML = pages.map(function (p, i) {
    var inner = p.type === 'cover' ? renderCover() : p.type === 'stage' ? renderStage(p, i) : renderEnding();
    return '<section class="page" data-index="' + i + '" aria-hidden="true">' + inner + '</section>';
  }).join('');
  document.getElementById('book-title').textContent = BOOK.title || '';
  var codexBtn = document.getElementById('codex-btn');
  codexBtn.textContent = V.codex;

  // map
  var trail = document.getElementById('trail');
  trail.innerHTML = pages.map(function (p, i) {
    var label = p.type === 'cover' ? esc(BOOK.title) : p.type === 'stage' ? esc(p.stage.title) : esc(V.recap);
    var node = '<button class="node' + (p.type !== 'stage' ? ' terminus' : '') + '" data-go="' + i + '" type="button" aria-label="' + label + '"><span class="tip">' + label + '</span></button>';
    return (i > 0 ? '<span class="leg" data-leg="' + i + '"></span>' : '') + node;
  }).join('');

  // ---------- navigation ----------
  function go(i, opts) {
    if (i < 0 || i >= pages.length) return;
    index = i; visited[i] = true;
    var sections = main.querySelectorAll('.page');
    sections.forEach(function (sec, k) {
      var active = k === i; sec.classList.toggle('active', active); sec.setAttribute('aria-hidden', active ? 'false' : 'true');
    });
    trail.querySelectorAll('.node').forEach(function (n, k) { n.classList.toggle('current', k === i); n.classList.toggle('visited', !!visited[k] && k !== i); });
    trail.querySelectorAll('.leg').forEach(function (l) { l.classList.toggle('done', Number(l.dataset.leg) <= i); });
    var prog = document.getElementById('progress');
    prog.textContent = pages[i].type === 'stage' ? fmt(V.stageOf, { n: i, total: stages.length }) : '';
    try { localStorage.setItem(storageKey, JSON.stringify({ index: index, visited: visited })); } catch (e) { /* ignore */ }
    if (history.replaceState) history.replaceState(null, '', '#page-' + i);
    if (!(opts && opts.silent)) { var panel = sections[i].querySelector('.panel, .ending-card, .cover-card'); if (panel) { panel.scrollTop = 0; panel.focus({ preventScroll: true }); } }
  }

  // ---------- drawer ----------
  var drawer = document.getElementById('drawer'), drawerContent = document.getElementById('drawer-content');
  function openDrawer(html) { drawerContent.innerHTML = html; if (!drawer.open) drawer.showModal(); drawer.querySelector('.drawer-inner').scrollTop = 0; }
  function closeDrawer() { if (drawer.open) drawer.close(); }
  document.getElementById('drawer-close').addEventListener('click', closeDrawer);
  drawer.addEventListener('click', function (e) { if (e.target === drawer) closeDrawer(); });

  function showPopout(id, stage) {
    var p = findPopout(id, stage);
    if (!p) return;
    var src = p.source ? '<details class="source-box"><summary>' + esc(V.source) + '</summary><div class="source">' + p.source + '</div></details>' : '';
    openDrawer('<p class="eyebrow">' + esc(V.behind) + (p.term ? ' &middot; ' + esc(p.term) : '') + '</p><h2 id="drawer-title">' + esc(p.title || p.term || p.id) + '</h2><div class="explanation">' + (p.explanation || '') + '</div>' + src);
    main.querySelectorAll('.popout-link[data-popout="' + id + '"]').forEach(function (b) { b.classList.add('seen'); });
  }
  function showScroll(i) {
    var s = pages[i].stage;
    openDrawer('<p class="eyebrow">' + esc(V.source) + '</p><h2 id="drawer-title">' + esc(s.sourceHeading || s.title) + '</h2><div class="source">' + (s.sourceExcerpt || '') + '</div>');
  }
  function showCodex() {
    var groups = {}, order = [];
    allPopouts().forEach(function (x) { var key = x.stage ? x.stage.title : ''; if (!groups[key]) { groups[key] = []; order.push(key); } groups[key].push(x); });
    var html = '<p class="eyebrow">' + esc(V.codex) + '</p><h2 id="drawer-title">' + esc(V.codex) + '</h2><p>' + esc(V.codexIntro) + '</p><ul class="codex-list">';
    order.forEach(function (key) {
      if (key) html += '<li class="stage-group">' + esc(key) + '</li>';
      groups[key].forEach(function (x) {
        html += '<li><button class="term-btn" data-popout="' + esc(x.popout.id) + '" data-stage="' + x.stageIndex + '" type="button">' + esc(x.popout.title || x.popout.term) + '</button>' +
                (x.popout.term && x.popout.term !== x.popout.title ? '<div class="where">' + esc(x.popout.term) + '</div>' : '') + '</li>';
      });
    });
    openDrawer(html + '</ul>');
  }
  codexBtn.addEventListener('click', showCodex);

  // ---------- events ----------
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-go],[data-popout],[data-scroll]');
    if (!t) return;
    if (t.hasAttribute('data-go')) { closeDrawer(); go(Number(t.dataset.go)); }
    else if (t.hasAttribute('data-scroll')) { showScroll(Number(t.dataset.scroll)); }
    else if (t.hasAttribute('data-popout')) {
      var stage = t.dataset.stage != null && Number(t.dataset.stage) >= 0 ? stages[Number(t.dataset.stage)] : (pages[index].stage || null);

    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('popout-link')) { e.preventDefault(); e.target.click(); return; }

    if (e.target.closest('input, textarea')) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); go(index + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(index - 1); }
    else if (e.key === 'Home') { go(0); } else if (e.key === 'End') { go(pages.length - 1); }
  });

  var touchX = null;
  document.addEventListener('touchstart', function (e) { touchX = e.touches[0].clientX; }, { passive: true });
  document.addEventListener('touchend', function (e) { if (touchX == null || drawer.open) return; var dx = e.changedTouches[0].clientX - touchX; if (Math.abs(dx) > 70) go(index + (dx < 0 ? 1 : -1)); touchX = null; });

    });
  }

  window.addEventListener('hashchange', function () { var m = /^#page-(\d+)$/.exec(location.hash); if (m && Number(m[1]) !== index) go(Number(m[1])); });
  go(index, { silent: true });
})();
</script>
